# /etc/nginx/nginx.conf (relevant sections)
# 
# Add this rate limit zone in your http block:
# limit_req_zone $binary_remote_addr zone=shadowprint_limit:10m rate=3r/m;

# /etc/nginx/sites-available/shadowprint.yourdomain.com

server {
    server_name shadowprint.yourdomain.com;

    root /var/www/shadowprint;
    index index.html;

    # Rate limiting - 3 requests per minute per IP
    limit_req zone=shadowprint_limit burst=5 nodelay;
    limit_req_status 429;

    # Handle React Router (SPA) - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # SSL Configuration (managed by Certbot)
    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/shadowprint.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shadowprint.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP to HTTPS redirect
server {
    if ($host = shadowprint.yourdomain.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name shadowprint.yourdomain.com;
    return 404;
}
